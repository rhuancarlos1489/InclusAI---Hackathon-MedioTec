<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../ajustes.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="icon" href="../icone/inclusai-icon.png">
    <title>Login - InclusAI</title>
</head>
<body>
    <header>
        <h3 id="nomeProjeto">inclusAI</h3>
    </header>
    <div id="chamadaLogin">
        <h1 class="tituloDiv">Bem-vindo de volta.</h1>
        <p class="detalhesP">Entre para continuar adaptando seus materiais, do ponto em que você parou.</p>
    </div>
    <div id="espaçoLogin">
        <h1 class="tituloLogin">Entrar no InclusAI</h1>
        <label for="email">E-mail: </label>
        <input type="email" name="email" id="email" placeholder="nome@gmail.com">
        <label for="senha">Senha: </label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
        <label for="conexao">Manter conectado neste dispositivo</label>
        <input type="checkbox" name="conexao" id="conexao">
        <button id="btnEntrar" onclick="entrar()">Entrar</button>
        <div id="divAdicionais">
            <button>
                <p class="adicionais" onclick="recuperar()">Esqueci minha senha</p>
            </button>
            <p class="adicionais">Criar conta</p>
        </div>
        <div id="mensagem-aviso">
            </div>
    </div>
    <script src="../Acessibilidade/js-ajustes.js"></script>
    <script src="script.js"></script>
</body>
</html>
